name: riverrem
# Pull-only variant: images are built+pushed by CI to GHCR; Portainer pulls them
# (add a ghcr.io registry credential in Portainer → Registries). The app source no
# longer needs to live on the Docker host — you can even paste this straight into
# Portainer's web editor. Set OWNER to your GitHub org/user (lowercase), e.g. iconem.

services:
  api:
    image: ghcr.io/${OWNER:-iconem}/riverrem-api:${TAG:-latest}
    container_name: riverrem-api
    environment:
      PUBLIC_BASE: ${PUBLIC_BASE:-https://rem.prod.heritagewatch.ai}
      DATA_DIR: /data
    volumes:
      - cogs:/data
    networks: [internal]
    restart: unless-stopped

  web:
    image: ghcr.io/${OWNER:-iconem}/riverrem-web:${TAG:-latest}
    container_name: riverrem-web
    depends_on: [api]
    networks: [traefik_proxy, internal]
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.riverrem.rule: "Host(`${DOMAIN:-rem.prod.heritagewatch.ai}`)"
      traefik.http.routers.riverrem.entrypoints: websecure
      traefik.http.routers.riverrem.tls.certresolver: leresolver
      traefik.http.services.riverrem.loadbalancer.server.port: "80"
      traefik.docker.network: traefik_proxy

networks:
  traefik_proxy:
    external: true
  internal:

volumes:
  cogs:
