server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend API + the persistent COG store, proxied on the SAME origin as the app
    # (so share links + the MapLibre COG protocol work with no CORS, no extra subdomain).
    # COGs are streamed with HTTP range requests (206); buffering off keeps that intact.
    location ~ ^/(cogs|cog|compute|centerline|upload|sample|health|thumb|runs|gallery)(/|$) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;      # REM compute polling can be slow
        client_max_body_size 64m;     # shapefile/geojson uploads
    }

    # Single-page app
    location / {
        try_files $uri /index.html;
    }
}
