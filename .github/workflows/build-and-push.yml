name: build-and-push

# Build both images and push to GHCR. Portainer then PULLS them (no build on the
# host, app image lives only in the registry). Add a ghcr.io registry credential
# in Portainer → Registries (username = GitHub user, password = PAT w/ read:packages).

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: ./backend
          - name: web
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # lowercase owner for the image path (ghcr requires lowercase)
      - id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # web takes VITE_API_BASE="" (same origin); api ignores it
          build-args: |
            VITE_API_BASE=
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/riverrem-${{ matrix.name }}:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/riverrem-${{ matrix.name }}:${{ github.sha }}
