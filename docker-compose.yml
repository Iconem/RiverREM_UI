name: riverrem
# Traefik Git stack (builds both images on the Docker host from this repo — Portainer
# CE needs no registry pull of your app images). TLS is terminated by your existing
# Traefik via the external `traefik_proxy` network + leresolver. `web` (nginx) serves
# the SPA and proxies the API/COGs to `api` on the internal network, same origin.
#
# Portainer stack env vars:
#   DOMAIN        = rem.prod.heritagewatch.ai
#   PUBLIC_BASE   = https://rem.prod.heritagewatch.ai   (builds COG + share URLs)
#   VITE_API_BASE = (empty — same origin)

services:
  api:
    build: ./backend
    image: riverrem-api:latest
    container_name: riverrem-api
    environment:
      PUBLIC_BASE: ${PUBLIC_BASE:-https://rem.prod.heritagewatch.ai}
      DATA_DIR: /data
    volumes:
      - cogs:/data            # generated REM/DEM COGs persist here
    networks: [internal]
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
    image: riverrem-web:latest
    container_name: riverrem-web
    depends_on: [api]
    networks: [traefik_proxy, internal]
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.riverrem.rule: "Host(`${DOMAIN:-rem.prod.heritagewatch.ai}`)"
      traefik.http.routers.riverrem.entrypoints: websecure
      traefik.http.routers.riverrem.tls.certresolver: leresolver
      traefik.http.services.riverrem.loadbalancer.server.port: "80"
      traefik.docker.network: traefik_proxy

networks:
  traefik_proxy:
    external: true
  internal:

volumes:
  cogs:
