name: riverrem-local
# Full-stack smoke test on your dev machine — exercises the exact prod build + the
# nginx same-origin proxy, with no Traefik. Run:
#   docker compose -f docker-compose.local.yml up --build
# then open http://localhost:8080

services:
  api:
    build: ./backend
    environment:
      PUBLIC_BASE: http://localhost:${WEB_PORT:-8088}
      DATA_DIR: /data
      CENTERLINE_UPLOAD_MAX_BYTES: ${CENTERLINE_UPLOAD_MAX_BYTES:-67108864}
      CENTERLINE_MAX_FEATURES: ${CENTERLINE_MAX_FEATURES:-10000}
      CENTERLINE_MAX_VERTICES: ${CENTERLINE_MAX_VERTICES:-500000}
      DEM_UPLOAD_ENABLED: ${DEM_UPLOAD_ENABLED:-false}
      DEM_UPLOAD_MAX_BYTES: ${DEM_UPLOAD_MAX_BYTES:-21474836480}
      DEM_UPLOAD_TTL_HOURS: ${DEM_UPLOAD_TTL_HOURS:-24}
      DEM_UPLOAD_CLEANUP_INTERVAL_MINUTES: ${DEM_UPLOAD_CLEANUP_INTERVAL_MINUTES:-15}
      DEM_LIBRARY_DIR: ${DEM_LIBRARY_DIR:-}
      DEM_LIBRARY_LABEL: ${DEM_LIBRARY_LABEL:-Server library}
      CUSTOM_DEM_MAX_PIXELS: ${CUSTOM_DEM_MAX_PIXELS:-45000000}
    volumes:
      - cogs:/data
      # Set DEM_LIBRARY_DIR=/dem-library to expose this read-only mount.
      - ${DEM_LIBRARY_HOST_DIR:-./dem-library}:/dem-library:ro
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ""
        VITE_GIT_SHA: ${GIT_SHA:-dev}
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on: [api]
    restart: unless-stopped

volumes:
  cogs:
